# cargo-audit 配置:Rust 安全公告豁免
# 运行:cargo audit
#
# 处置策略与 deny.toml 保持一致:出现新 advisory 时,若为不可达路径
# (transitive/未启用 feature) 或攻击面不适用,可在此记录豁免;
# 否则必须升级修复。豁免理由详见 deny.toml 同 ID 条目。

[advisories]
ignore = [
    # RUSTSEC-2023-0071 (Marvin Attack):rsa 仅由 garrison → jsonwebtoken
    # 传递引入,用于 JWT 签名/验证;Marvin 攻击针对 RSA PKCS#1 v1.5 解密
    # 时序侧信道,不涉及本项目攻击面;上游无补丁,跟踪
    # https://github.com/RustCrypto/RSA/issues/626,发布后撤销本豁免。
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0367 / -0368 / -0369(zip 解包保留 SUID/SGID、符号链接逃逸):
    # zip 只由 candle-core 0.11.0(optional,candle feature)在锁文件中持有
    # (Cargo 按全 feature 并集解析,optional 依赖解析层始终存在);utoipa-swagger-ui
    # 侧来源已随 sdforge 0.5.0-rc.9 移除。CI 无 job 启用 candle,且未调用受害 API
    # (ZipArchive::extract / ZipStreamReader::extract;candle 走 ZipArchive::new
    # 读取),上游 candle-core 最新版仍要求 zip ^8.6 无 9.x 补丁可选,故豁免;
    # candle 升级或移除时撤销本豁免。
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # RUSTSEC-2026-0381（webpki-roots 内置根含被撤销的 emSign 中间根）：
    # tokenizers 0.23.2 → hf-hub 0.4.3 → ureq 2.12.1 → webpki-roots 0.26.11，
    # 而 0.26.11 已是该系列最新版（无同系列补丁）；修复在 1.x（1.0.10），
    # 本仓那份 1.x 副本本轮已升级。理由与退出条件同 deny.toml 同 ID 条目。
    "RUSTSEC-2026-0381",
]
