# CI 质量门禁：fmt / clippy / check / test / coverage / deny
#
# 特性约束：sqlite 与 postgres 由 dbnexus compile_error! 强制互斥，
# 禁止 --all-features（会同时打开两组驱动）；cuda/metal 无对应硬件。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 与 health-check.yml 同口径的“全功能”组合（不含互斥驱动与硬件后端）。
  FEATURES: "grpc,cli,auth,onnx,db,sqlite,openapi,mcp"
  # 覆盖率口径：与发布主面一致的“可测全集”（含共享状态与集成测试），
  # 不并入 cli/mcp/grpc 的协议包装层（各自有独立 test 腿验证编译与行为）。
  COVERAGE_FEATURES: "http,auth,db,sqlite,distributed-redis"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.97.1
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.97.1
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: clippy
      - name: Run clippy
        run: cargo clippy --features "${{ env.FEATURES }}" --all-targets -- -D warnings -W clippy::unwrap_used

  check:
    name: Check (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        features: ["", "grpc", "auth,db,sqlite,onnx", "postgres"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: check-${{ matrix.features }}
      - name: Check
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo check --no-default-features
          else
            cargo check --features "${{ matrix.features }}"
          fi

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: grpc
            features: "grpc"
          - name: ecosystem
            features: "auth,db,sqlite,onnx"
          - name: shared-state
            features: "http,auth,db,sqlite,distributed-redis"
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test-${{ matrix.name }}
      - name: Run tests
        env:
          VECBOOST_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo test
          else
            cargo test --features "${{ matrix.features }}"
          fi

  coverage:
    name: Coverage (lines >= 95%)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.97.1
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: coverage
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov
      # 覆盖率同口径前提：模型/ORT 依赖的测试（HTTP/翻译/引擎 E2E）在缺
      # 资产时会跳过，使 CI 覆盖率低于本地实测。此处缓存并预置最小资产集。
      - name: Cache ONNX runtime and models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/vecboost-ci
            models/Xenova-bge-small-en-v1.5
            models/opus-mt-en-zh
            models/Xenova-all-MiniLM-L6-v2
          key: vecboost-onnx-assets-ort1.28.2-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Provision ONNX Runtime 1.28.2
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/vecboost-ci"
          ORT_DIR="$HOME/.cache/vecboost-ci/onnxruntime-linux-x64-1.28.2"
          if [ ! -f "$ORT_DIR/lib/libonnxruntime.so" ]; then
            curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v1.28.2/onnxruntime-linux-x64-1.28.2.tgz" -o /tmp/ort.tgz
            echo "d7209b8751b27b862b0c76332c2e20e203396edb5dab700ecf4bb485cf147415  /tmp/ort.tgz" | sha256sum -c -
            tar -xzf /tmp/ort.tgz -C "$HOME/.cache/vecboost-ci"
          fi
          echo "ORT_DYLIB_PATH=$ORT_DIR/lib/libonnxruntime.so" >> "$GITHUB_ENV"
          # tests/http_surface.rs 等以 `ORT_DYLIB_PATH` 覆盖为仓库默认落位
          # `3rdparty/onnxruntime/libonnxruntime.so`（本地开发口径）；CI 缺该落位
          # 时这些用例以 ORT dylib 加载 panic 退出，故软链预置 ORT 到该路径。
          mkdir -p 3rdparty/onnxruntime
          ln -sf "$ORT_DIR/lib/libonnxruntime.so" 3rdparty/onnxruntime/libonnxruntime.so
      - name: Provision ONNX models
        run: |
          set -euo pipefail
          python -m pip install -q "huggingface_hub==2.2.0"
          if [ ! -f models/Xenova-bge-small-en-v1.5/config.json ] \
            || [ ! -f models/Xenova-bge-small-en-v1.5/tokenizer.json ] \
            || [ ! -f models/Xenova-bge-small-en-v1.5/model.onnx ]; then
            hf download Xenova/bge-small-en-v1.5 \
              config.json tokenizer.json tokenizer_config.json special_tokens_map.json onnx/model.onnx \
              --revision ea104dacec62c0de699686887e3f920caeb4f3e3 \
              --local-dir models/Xenova-bge-small-en-v1.5
            cp models/Xenova-bge-small-en-v1.5/onnx/model.onnx models/Xenova-bge-small-en-v1.5/model.onnx
          fi
          if [ ! -f models/opus-mt-en-zh/config.json ] \
            || [ ! -f models/opus-mt-en-zh/generation_config.json ] \
            || [ ! -f models/opus-mt-en-zh/tokenizer.json ] \
            || [ ! -f models/opus-mt-en-zh/onnx/encoder_model.onnx ] \
            || [ ! -f models/opus-mt-en-zh/onnx/decoder_model_merged.onnx ]; then
            hf download Xenova/opus-mt-en-zh \
              config.json generation_config.json tokenizer.json tokenizer_config.json special_tokens_map.json onnx/encoder_model.onnx onnx/decoder_model_merged.onnx \
              --revision 046f55aec303cdee3e0318604406d4df20f1e8ea \
              --local-dir models/opus-mt-en-zh
          fi
          # server_variants 的第二模型（模型切换/卸载生命周期）
          if [ ! -f models/Xenova-all-MiniLM-L6-v2/config.json ] \
            || [ ! -f models/Xenova-all-MiniLM-L6-v2/tokenizer.json ] \
            || [ ! -f models/Xenova-all-MiniLM-L6-v2/model.onnx ]; then
            hf download Xenova/all-MiniLM-L6-v2 \
              config.json tokenizer.json onnx/model.onnx \
              --revision 751bff37182d3f1213fa05d7196b954e230abad9 \
              --local-dir models/Xenova-all-MiniLM-L6-v2
            cp models/Xenova-all-MiniLM-L6-v2/onnx/model.onnx models/Xenova-all-MiniLM-L6-v2/model.onnx
          fi
      - name: Generate coverage
        env:
          VECBOOST_TEST_REDIS_URL: redis://127.0.0.1:6379
        # 多腿合并：共享状态腿 + db/sqlite 腿。禁止 --lib 窄口径：
        # 集成测试与引擎 E2E 的错误分支同样计入分母。
        # 共享 pipeline registry 的用例由 src/pipeline/handler.rs 内的
        # REGISTRY_LOCK 在模块级串行化——那 21 个触碰 registry/队列的用例全部持锁，
        # 其余 13 个只测 mock 引擎、不涉共享状态。新增触碰该 registry 的用例必须
        # 持同一把锁，否则并行下会间歇失败。
        # 不在此加 --test-threads=1：当前树实测并行 58.45s vs 串行 211.57s（3.62 倍）。
        # 两个被引的历史 run 不构成受控 A/B——它们的 coverage 作业都在到达覆盖率
        # 门禁前就红了（同一条 auth_session_backend_database_login_and_revoke
        # 401/200），且用例体一为回填前、一为回填后；作业级墙钟比值仅 1.12 倍
        # （14m45s vs 16m29s，其中 13 分钟是编译）。共享的 embed_in_flight_map 由
        # REGISTRY_LOCK 串行化，串行 flag 换不到额外保证。
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --features "${{ env.COVERAGE_FEATURES }}" --tests
          cargo llvm-cov --no-report --features "http,auth,db,sqlite" --tests
          # 真实启动腿：main.rs 的组合根（init_*/run_servers/优雅停机）只有跑真实二进制才会
          # 命中，cargo test 结构上执行不到（main.rs 429 行未覆盖几乎全在此）。同样
          # 必须 SIGTERM 并等到进程真退出：profraw 只在退出时 flush，SIGKILL 会静默丢
          # 本腿数据（NebulaId 同口径改造时实测差 2.7pp）。
          mkdir -p "$RUNNER_TEMP/vbboot"
          cat > "$RUNNER_TEMP/vbboot/config.toml" <<'TOML'
          [server]
          host = "127.0.0.1"
          port = 9099
          grpc_enabled = false

          [model]
          model_path = "models/Xenova-bge-small-en-v1.5"
          model_repo = "Xenova/bge-small-en-v1.5"
          engine_type = "onnx"
          expected_dimension = 384

          [embedding]
          cache_enabled = true

          [rate_limit]
          enabled = false

          [database]
          url = "sqlite::memory:"

          [auth]
          enabled = false
          TOML
          cargo llvm-cov --no-report --features "${{ env.COVERAGE_FEATURES }}" \
            run --bin vecboost -- --config "$RUNNER_TEMP/vbboot/config.toml" &
          BOOT_PID=$!
          healthy=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9099/health >/dev/null 2>&1; then healthy=1; break; fi
            sleep 2
          done
          if [ "$healthy" != "1" ]; then
            echo "::error::vecboost 未在 120s 内就绪，无法采集组合根覆盖率"
            kill -TERM "$BOOT_PID" 2>/dev/null || true
            exit 1
          fi
          # 两发真实请求：覆盖 handler → pipeline → response 主干与缓存写入臂
          curl -sf -X POST http://127.0.0.1:9099/api/v1/embed \
            -H 'content-type: application/json' -d '{"text":"coverage boot probe"}' >/dev/null \
            || echo "::warning::embed 探针未返回 2xx"
          curl -sf -X POST http://127.0.0.1:9099/api/v1/search \
            -H 'content-type: application/json' -d '{"query":"q","texts":["a","b"],"top_k":1}' >/dev/null \
            || echo "::warning::search 探针未返回 2xx"
          kill -TERM "$BOOT_PID" 2>/dev/null || true
          # 本地实测优雅退出约 6s；给 60s 预算，超时即显性失败而不是默默缺覆盖率
          for i in $(seq 1 30); do
            if ! kill -0 "$BOOT_PID" 2>/dev/null; then break; fi
            sleep 2
          done
          if kill -0 "$BOOT_PID" 2>/dev/null; then
            echo "::error::vecboost 未在 60s 内优雅退出，profraw 未刷新"
            kill -9 "$BOOT_PID" 2>/dev/null || true
            exit 1
          fi
          wait "$BOOT_PID" 2>/dev/null || true
          cargo llvm-cov report --lcov --output-path coverage/lcov.info
      - name: Enforce line coverage
        # llvm-cov 0.9.1 的 --fail-under-lines 可用，但仍保留显式 lcov 判定以便审计数值。
        run: |
          total=$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{if (lf==0) {print "0.00"} else {printf "%.2f", 100*lh/lf}}' coverage/lcov.info)
          echo "实测行覆盖率: ${total}%（分母 $(awk -F: '/^LF:/{s+=$2} END{print s}' coverage/lcov.info) 行）"
          awk -v t="$total" 'BEGIN{exit !(t+0 >= 95)}' || {
            echo "::error::行覆盖率 ${total}% < 95%"
            exit 1
          }
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  deny:
    name: Deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny
      - name: cargo deny
        run: cargo deny check
