name: Feature Matrix

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE*"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE*"
  workflow_dispatch:

# 最小权限:CI 只需读取源码,不给予 GITHUB_TOKEN 写权限
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: feature-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-matrix:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: grpc
            features: "grpc"
          - name: ecosystem
            features: "auth,db,sqlite,onnx"
          - name: postgres-driver
            features: "postgres"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Protocol Buffers compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "feature-matrix-${{ matrix.name }}"
          cache-targets: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all features compile
        run: cargo check --features "grpc,cli,auth,onnx,db,sqlite,openapi,mcp"

      - name: Check swagger-ui docs build
        if: matrix.name == 'default'
        run: cargo check --features swagger-ui --locked

      - name: Check quantized-gguf engine build
        if: matrix.name == 'default'
        run: cargo check --features quantized-gguf --lib --locked

      - name: Check distributed-redis build
        if: matrix.name == 'default'
        run: cargo check --features distributed-redis --all-targets --locked

      - name: Compile quantized quality gate
        if: matrix.name == 'default'
        # 真跑质量门仍需模型资产（缺失自动 SKIP）；此步保证目标持续可编译
        run: cargo test --features quantized-gguf --test quantized_parity --no-run --locked

      - name: Check examples crate
        # 2026-09-19 审计补腿：examples 是 workspace 成员但此前从未进 CI
        run: cargo check -p vecboost-examples --all-targets

      - name: Run clippy
        if: matrix.features != ''
        run: cargo clippy --features "${{ matrix.features }}" --all-targets -- -D warnings

      - name: Run clippy (default features)
        if: matrix.features == ''
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        if: matrix.features != ''
        run: cargo build --features "${{ matrix.features }}"

      - name: Build (default features)
        if: matrix.features == ''
        run: cargo build

      - name: Run tests
        if: matrix.features != '' && matrix.name != 'postgres-driver'
        run: cargo test --features "${{ matrix.features }}" --lib

      - name: Run tests (default features)
        if: matrix.features == ''
        run: cargo test --lib

  summary:
    name: Feature Matrix Summary
    runs-on: ubuntu-latest
    needs: feature-matrix
    if: always()
    steps:
      - name: Check matrix status
        run: |
          if [[ "${{ needs.feature-matrix.result }}" == "success" ]]; then
            echo "✅ All feature matrix combinations passed!"
            exit 0
          else
            echo "❌ One or more feature matrix combinations failed!"
            exit 1
          fi
