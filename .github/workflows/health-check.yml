name: Health Check

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE*"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE*"

# 最小权限:CI 只需读取源码与写缓存,不给予 GITHUB_TOKEN 写权限
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FEATURES: "grpc,cli,auth,onnx,db,sqlite,openapi,mcp"

concurrency:
  group: health-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Protocol Buffers compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "vecboost-check"
          cache-targets: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check clippy
        # unwrap_used:生产代码 panic 面门禁(测试代码由 clippy.toml 豁免)
        run: cargo clippy --features "${{ env.FEATURES }}" --all-targets -- -D warnings -W clippy::unwrap_used

      - name: Check i18n consistency
        # 默认英文(en 语言包零中文) + en/zh 键齐性 + tr()/i18n_key 引用有效 +
        # 生产码硬编码中文/未登记用户可见文案回流拦截
        run: python3 scripts/i18n_consistency_check.py

      - name: Check doc consistency
        # 文档声明的路由/gRPC/环境变量/CLI 子命令与代码核对,并校验文档锚点可达性
        # (经 GitHub 渲染结果校准的 slug 规则:emoji 标题带前导连字符、U+FE0F
        #  变体选择符残留于 id 首位,两类坑均在拦截范围)
        run: python3 scripts/doc_consistency_check.py

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    strategy:
      fail-fast: false
      matrix:
        feature:
          - name: default
            features: ""
          - name: onnx
            features: onnx
          - name: grpc
            features: grpc
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install Protocol Buffers compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "vecboost-build-${{ matrix.feature.name }}"
          cache-targets: false

      - name: Build with ${{ matrix.feature.name }} features
        run: cargo build --release --features "${{ matrix.feature.features }}"

  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install Protocol Buffers compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "vecboost-test"
          cache-targets: false

      - name: Run tests
        run: cargo test --features "${{ env.FEATURES }}" --lib

      - name: Run integration tests
        run: cargo test --features "${{ env.FEATURES }}" --tests

  test-coverage:
    name: Test (Coverage)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 40
    services:
      # 与 ci.yml 覆盖率作业同前提：distributed-redis 系列用例（oxcache_backend /
      # limiteron_adapter / redis_semantic_index）无 redis 时整块 SKIP，
      # SKIP 不是覆盖——这是本作业比 ci.yml 低的执行宇宙差异之一。
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install Protocol Buffers compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "vecboost-coverage"
          cache-targets: false

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Run tests with coverage
        # tarpaulin 与新 stable 工具链不兼容（pulp 0.22.3 const 断言 E0080
        # 插桩构建必炸，2026-10-15 实录），按发布流水线生态表切换 llvm-cov。
        # 口径：lib + 集成测试（禁止 --lib 窄口径）；llvm-cov 不自建输出目录，须先 mkdir
        # 本腿特征比 FEATURES 多一个 distributed-redis（本地 cargo check 已验证该
        # 组合合法，exit 0），否则 redis 系模块全部 SKIP，分母同、分子偏低。
        env:
          VECBOOST_TEST_REDIS_URL: redis://127.0.0.1:6379
          OXCACHE_ALLOW_INSECURE_REDIS: I_UNDERSTAND_THE_RISKS
        run: mkdir -p coverage/ && cargo llvm-cov --quiet --features "${{ env.FEATURES }},distributed-redis" --tests --lcov --output-path coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Check coverage threshold
        # 硬门禁：llvm-cov 运行失败（无 lcov 产出）或行覆盖率 < 90% 都将使本 job 失败
        # 90% 是用户 2026-10-21 授权的最低底线（与 ci.yml 同口径，原 95% 已证明不可达）。
        run: |
          total=$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{if (lf==0) {print "0.00"} else {printf "%.2f", 100*lh/lf}}' coverage/lcov.info)
          threshold=90
          echo "Coverage: ${total}% (lines, llvm-cov)"
          echo "Threshold: ${threshold}%"
          if (( $(echo "$total >= $threshold" | bc -l) )); then
            echo "Coverage requirement met (>= 90%)"
          else
            echo "Coverage requirement NOT met (>= 90%)"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    needs: build
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Protocol Buffers compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3

      - name: Cache cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-

      - name: Set Windows environment
        shell: pwsh
        run: |
          echo "CARGO_TERM_COLOR=always" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "RUSTFLAGS=-D warnings" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        # continue-on-error: confers file_optional misses the tempfile on Windows CI
        # (third-party library behavior, not project code; linux Test (Linux) fully
        # covers the same config-loading logic). Tracked as follow-up.
        continue-on-error: true
        run: cargo test --features "${{ env.FEATURES }}" --all-targets --release

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-windows
          path: target/release/deps/

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rust-docs

      - name: Install Protocol Buffers compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "vecboost-doc"
          cache-targets: false

      - name: Build documentation
        run: cargo doc --workspace --no-deps

      - name: Check for broken links
        run: cargo doc --workspace --no-deps --document-private-items

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        run: cargo audit

  dockerfile-scan:
    name: Dockerfile Security Scan
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 10
    # 上传 SARIF 到 Security 标签页需要写权限(工作流级保持最小权限,仅此 job 放宽)
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Checkov Dockerfile scanner
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: .
          framework: dockerfile
          soft_fail: false
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Upload Checkov results to GitHub Security
        # 门禁本体是上一步扫描的退出码（soft_fail:false 保持严格）。checkov-action
        # 在 soft_fail:false 且全部通过时不落 sarif 文件（实测 9 passed/0 failed 后
        # 本步 "Path does not exist" 必红）——上传是代码扫描遥测，非门禁，
        # 文件缺失时容忍跳过；sarif 存在则正常上传。
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: checkov-results.sarif

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install Protocol Buffers compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "vecboost-bench"
          cache-targets: false

      - name: Run benchmarks
        run: cargo bench --features "${{ env.FEATURES }}"

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: target/criterion/report/

  dependencies:
    name: Dependency Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Check for outdated dependencies
        run: |
          cargo install cargo-outdated --locked 2>/dev/null || true
          cargo outdated --root-deps-only || echo "cargo-outdated not available, skipping"
