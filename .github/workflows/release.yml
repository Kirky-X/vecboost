name: Release

on:
  push:
    tags:
      - 'v*'

# 最小权限:顶层只读,发布 job 单独声明 contents: write
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Install Protocol Buffers compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "release-validate"
          cache-targets: false

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Clippy Lint
        run: cargo clippy --features "grpc,cli,auth,onnx,db,sqlite,openapi,mcp" --all-targets -- -D warnings

      - name: Cargo Audit
        run: cargo audit

      - name: Build Check
        run: cargo build --features "grpc,cli,auth,onnx,db,sqlite,openapi,mcp"

      - name: Run Tests
        run: cargo test --features "grpc,cli,auth,onnx,db,sqlite,openapi,mcp" --lib



  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Get Version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # semver 预发布段（-rc.N 等）→ GitHub prerelease 标记；rc 不得抢占 Latest。
      # LATEST 与 PRERELEASE 互补：正式版发布即取 Latest，rc 不取
      - name: Derive prerelease flag
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
            echo "LATEST=false" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
            echo "LATEST=true" >> "$GITHUB_OUTPUT"
          fi

      # Release 只带 GitHub 自动生成的源码压缩包,不附二进制产物。
      # 幂等：view→create-or-edit 全状态幂等（softprops 对同 tag 存在过
      # Draft 的场景会走 create 撞 already_exists，2026-10-16 实录）；
      # uniqueness 断言随后钉住恰好 1 个。
      - name: Create or update Release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TITLE="Release ${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --draft=false \
              --prerelease="${{ steps.meta.outputs.PRERELEASE }}" \
              --latest="${{ steps.meta.outputs.LATEST }}"
          else
            gh release create "$TAG" --title "$TITLE" --generate-notes \
              --draft=false --prerelease="${{ steps.meta.outputs.PRERELEASE }}" \
              --latest="${{ steps.meta.outputs.LATEST }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release uniqueness (idempotency guard)
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq "[.[] | select(.tag_name == \"${TAG}\")] | length")
          echo "release objects for ${TAG}: ${COUNT}"
          if [ "${COUNT}" != "1" ]; then
            echo "::error::expected exactly 1 release for ${TAG}, found ${COUNT}; release state is not idempotent"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    needs: [github-release]
    runs-on: ubuntu-latest
    # 冷缓存全量验证编译曾超 10m 被取消,放宽到 30m。
    # crates.io trusted publishing（OIDC，2026-10-16 owner 注册）：
    # id-token: write 必需；cargo（1.86+ stable 自带）检测 Actions OIDC
    # 环境自动换取短时凭证，无需 CARGO_REGISTRY_TOKEN。
    # 注册绑定须与本项目一致：repo=Kirky-X/vecboost，workflow=release.yml
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Protocol Buffers compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3

      - name: Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "release-publish"
          cache-targets: false

      # 幂等:已发布版本直接跳过,避免重跑时"already exists"报错
      - name: Check already published
        id: published
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H 'User-Agent: kirky-x-release-verify' \
            "https://crates.io/api/v1/crates/vecboost/${VERSION}")
          echo "vecboost ${VERSION}: HTTP ${CODE}"
          echo "exists=$([[ "$CODE" == "200" ]] && echo true || echo false)" >> $GITHUB_OUTPUT

      # crates.io trusted publishing（OIDC）：官方 rust-lang/crates-io-auth-action
      # 以 Actions OIDC 换取 30 分钟短时凭证——长生命周期令牌彻底退役
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
        id: auth

      - name: Publish to crates.io
        if: steps.published.outputs.exists == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # crates.io 版本硬校验:防止任何形式的静默漏发。
      # 索引可见性有延迟：403（未就绪）/ 404（索引未刷新）都必须继续轮询，
      # 只有 200 才算成功；其他非预期状态码立即失败。
      - name: Verify on crates.io
        if: always()
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ok=""
          for i in $(seq 1 40); do
            sleep 30
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H 'User-Agent: kirky-x-release-verify' \
              "https://crates.io/api/v1/crates/vecboost/${VERSION}")
            echo "try$i: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then ok=1; break; fi
            case "$CODE" in
              403|404) continue ;;
              *) break ;;
            esac
          done
          if [ -z "$ok" ]; then
            echo "::error::vecboost ${VERSION} 未出现在 crates.io"
            exit 1
          fi

  notify:
    name: Notify Status
    needs: [github-release, publish-crates]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check status
        run: |
          echo "github-release: ${{ needs.github-release.result }}"
          echo "publish-crates: ${{ needs.publish-crates.result }}"
          if [[ "${{ needs.github-release.result }}" == "success" ]] && \
             [[ "${{ needs.publish-crates.result }}" == "success" ]]; then
            echo "✅ Release completed successfully!"
            exit 0
          else
            echo "❌ Release failed!"
            exit 1
          fi
