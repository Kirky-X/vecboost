name: Release

on:
  push:
    tags:
      - 'v*'

# 最小权限:顶层只读,发布 job 单独声明 contents: write
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Install Protocol Buffers compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "release-validate"
          cache-targets: false

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Clippy Lint
        run: cargo clippy --features "grpc,cli,auth,onnx,db,sqlite,openapi,mcp" --all-targets -- -D warnings

      - name: Cargo Audit
        run: cargo audit

      - name: Build Check
        run: cargo build --features "grpc,cli,auth,onnx,db,sqlite,openapi,mcp"

      - name: Run Tests
        run: cargo test --features "grpc,cli,auth,onnx,db,sqlite,openapi,mcp" --lib



  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Get Version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # Release 只带 GitHub 自动生成的源码压缩包,不附二进制产物。
      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    needs: [github-release]
    runs-on: ubuntu-latest
    # 冷缓存全量验证编译曾超 10m 被取消,放宽到 30m
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Protocol Buffers compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3

      - name: Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "release-publish"
          cache-targets: false

      # 幂等:已发布版本直接跳过,避免重跑时"already exists"报错
      - name: Check already published
        id: published
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H 'User-Agent: kirky-x-release-verify' \
            "https://crates.io/api/v1/crates/vecboost/${VERSION}")
          echo "vecboost ${VERSION}: HTTP ${CODE}"
          echo "exists=$([[ "$CODE" == "200" ]] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Publish to crates.io
        if: steps.published.outputs.exists == 'false'
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # crates.io 版本硬校验:防止任何形式的静默漏发
      - name: Verify on crates.io
        if: always()
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ok=""
          for i in 1 2 3 4 5; do
            sleep 20
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H 'User-Agent: kirky-x-release-verify' \
              "https://crates.io/api/v1/crates/vecboost/${VERSION}")
            echo "try$i: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then ok=1; break; fi
            if [ "$CODE" != "403" ]; then break; fi
          done
          if [ -z "$ok" ]; then
            echo "::error::vecboost ${VERSION} 未出现在 crates.io"
            exit 1
          fi

  notify:
    name: Notify Status
    needs: [github-release, publish-crates]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check status
        run: |
          echo "github-release: ${{ needs.github-release.result }}"
          echo "publish-crates: ${{ needs.publish-crates.result }}"
          if [[ "${{ needs.github-release.result }}" == "success" ]] && \
             [[ "${{ needs.publish-crates.result }}" == "success" ]]; then
            echo "✅ Release completed successfully!"
            exit 0
          else
            echo "❌ Release failed!"
            exit 1
          fi
