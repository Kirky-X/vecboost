name: Scenario Tests

# Python E2E/场景测试(conftest.py 拉起真实二进制,HTTP/CLI/MCP/生命周期矩阵)。
# CI 环境无本地模型,tests/scenario 按 models/<目录名> 存在性自动 SKIP 推理类用例,
# 其余(生命周期/错误路径/CLI)正常执行。夜跑 + 手动触发,不阻塞 PR。

on:
  schedule:
    - cron: "0 3 * * *" # 每日 UTC 03:00(北京时间 11:00)
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: scenario-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenario:
    name: Pytest Scenario Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "vecboost-scenario"
          cache-targets: false

      - name: Build server binary (protocol features required by scenario suite)
        # 套件覆盖 auth/CLI/MCP/gRPC 能力：仅 --features http 会使 auth 路由
        # 缺失（login 404 假红）且 CLI/MCP 探针退化为 skip
        run: cargo build -p vecboost --features http,auth,cli,mcp,grpc

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pytest dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-timeout requests

      - name: Run scenario tests
        run: pytest tests/scenario -q --junitxml=scenario-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scenario-results
          path: scenario-results.xml
          retention-days: 14
