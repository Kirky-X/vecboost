# Pre-commit hooks for VecBoost Rust Project
#
# This configuration defines pre-commit checks that run before each commit.
# All checks must pass for the commit to be allowed.
#
# Installation:
#   1. Install pre-commit: pip install pre-commit
#   2. Initialize hooks: pre-commit install
#   3. Update hooks: pre-commit autoupdate
#
# Manual run:
#   pre-commit run --all-files

repos:
  # Custom Rust pre-commit script (main check)
  - repo: local
    hooks:
      - id: vecboost-precommit
        name: VecBoost pre-commit checks
        description: Run all VecBoost pre-commit checks (fmt, clippy, check, build)
        entry: bash scripts/pre-commit.sh check
        language: system
        pass_filenames: false
        always_run: false

  # Cargo fmt check
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        description: Check Rust code formatting with cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        always_run: true
        types: [rust]

  # Copyright header check
  - repo: local
    hooks:
      - id: copyright-header
        name: Check copyright headers
        description: Verify all .rs files have Apache-2.0 copyright headers (Kirky.X🌠)
        entry: bash scripts/pre-commit.sh copyright
        language: system
        pass_filenames: false
        always_run: true
        types: [rust]

  # i18n 一致性门禁（默认英文 + 硬编码文案回流拦截）
  - repo: local
    hooks:
      - id: i18n-consistency
        name: i18n consistency check
        description: Verify en FTL has no CJK, en/zh key parity, tr()/i18n_key references resolve, and production user-visible strings are localized or registered
        entry: python3 scripts/i18n_consistency_check.py
        language: system
        pass_filenames: false
        always_run: true
        types: [rust]

  # 文档一致性门禁（声明核对 + 锚点可达性）
  # 注：本钩子故意不设 types——.pre-commit-config.yaml 的 exclude 排除了整个
  # docs/，若按 markdown 触发则只改文档的提交会跳过它（锚点回归恰好只在
  # 改文档时产生）。always_run + pass_filenames:false 不受 exclude 影响。
  - repo: local
    hooks:
      - id: doc-consistency
        name: doc consistency check
        description: Verify documented routes/grpc methods/env vars/CLI subcommands match code, and markdown anchors resolve to real GitHub heading ids
        entry: python3 scripts/doc_consistency_check.py
        language: system
        pass_filenames: false
        always_run: true

  # Remove trailing whitespace
  # 注：以下三个钩子原为 language: system + 自定义 entry，但系统中并无
  # trailing-whitespace-fixer / check-merge-conflict / check-added-large-files
  # 可执行文件，钩子会以 "Executable ... not found" 失败并拦下所有提交。
  # 故改为使用仓库自带环境（由 pre-commit 按 rev 固定版本安装），入口取默认值。
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: Check trailing whitespace

  # Check for merge conflicts
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
        name: Check for merge conflict markers

  # Detect large files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']

  # === 提交完成后清理本地编译产物（post-commit 阶段；启用: pre-commit install -t post-commit） ===
  - repo: local
    hooks:
      - id: post-commit-clean
        name: clean local build artifacts (cargo target + python)
        entry: >-
          bash -c 'cargo clean >/dev/null 2>&1;
          find . \( -name node_modules -o -name .venv \) -prune -o -type d -name target -prune -exec rm -rf {} +;
          find . \( -name node_modules -o -name .venv \) -prune -o -type d \( -name __pycache__ -o -name .pytest_cache -o -name .mypy_cache -o -name .ruff_cache -o -name .hypothesis -o -name "*.egg-info" \) -prune -exec rm -rf {} +;
          find . \( -name node_modules -o -name .venv \) -prune -o -type f \( -name "*.pyc" -o -name "*.pyo" \) -exec rm -f {} +;
          if [ -z "$(git ls-files build dist)" ]; then rm -rf build dist; fi;
          echo "[post-commit] 已清理 cargo target 与 Python 编译产物"'
        language: system
        always_run: true
        pass_filenames: false
        stages: [post-commit]
# Global settings
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
minimum_pre_commit_version: '3.0.0'

# Exclude patterns
exclude: |
  (?x)^(
    target/|
    \.git/|
    \.cargo/|
    \.github/workflows/|
    docs/|
    \.pyc$
  )
