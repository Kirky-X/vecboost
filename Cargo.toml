[package]
name = "vecboost"
version = "0.3.0-rc.2"
edition = "2024"
rust-version = "1.91"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
description = "High-performance multi-task inference service: embeddings, rerank, decision, translation, and language detection"
repository = "https://github.com/Kirky-X/vecboost"
documentation = "https://github.com/Kirky-X/vecboost"
homepage = "https://github.com/Kirky-X/vecboost"
license = "Apache-2.0"
keywords = ["embedding", "vector", "inference", "translation", "language-detection"]
categories = ["asynchronous", "science", "web-programming::http-server"]

[dependencies]
# Base async runtime & utilities (always required)
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
sys-info = { version = "0.9", default-features = false }
num_cpus = { version = "1.17", default-features = false }
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
regex = { version = "1.13", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false, features = ["alloc"] }
rand = { version = "0.10", default-features = false, features = ["thread_rng", "alloc"] }
hex = { version = "0.4", default-features = false, features = ["std"] }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
# 0.6 起 hash_password_into 被 alloc feature 门控（derive_key 依赖它）
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }

# Serialization (base)
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }

# Error Handling (base)
anyhow = { version = "1.0", default-features = false, features = ["std"] }

# Internationalization (i18n) — ICU+Fluent 中英双语支持
# fluent-bundle concurrent 变体为 Send+Sync，双束可入 static OnceLock（dbnexus 模式）；
# icu 2.3 compiled_data 内置 CLDR 数据，无需运行时加载
sys-locale = { version = "0.3", default-features = false }
unic-langid = { version = "0.9", default-features = false, features = ["likelysubtags"] }
fluent-bundle = { version = "0.16", default-features = false }
icu = { version = "2.3", default-features = false, features = ["compiled_data"] }
writeable = { version = "0.6", default-features = false }

# Module Registry (always required) — 保留 reload/confers 热重载 + i18n 模块消息国际化
# negotiate(2026-09-16 吸收)：模块能力版本协商（build 时 semver 校验），
# vecboost 全部 20 个 ModuleMeta 实现（src/registry 17 个无条件 +
# auth/http feature 门控 3 个，另 src/logger 的 inklog_logger）均已声明
# VERSION，为跨库模块接入提供 fail-fast
# rc.7-rc.9 新增 probe/report/presets(-remote)/di/interface/compose/request-scope/
# encryption 探测与装配面：/health?depth=full（src/api/embedding.rs）与
# kit.set_config 装配已有自建实现，全部零接线不启用。
trait-kit = { version = "0.5.0-rc.9", default-features = false, features = ["async", "lifecycle", "health", "shutdown", "observer", "scope", "toggle", "decorator", "reload", "confers", "i18n", "negotiate"] }

# Configuration infrastructure
# feature 瘦身:仅保留实际接线能力(toml/env 加载、校验、watch 热重载、
# 加密、schema 导出);config-bus/etcd/consul/nats/redis-bus/remote 等零接线项裁剪。
# rc.6-rc.10 新增 interpolation/lazy-parse/audit/key-management/cloud-kms/keyring/
# progressive-reload/change-stream 等无消费方,同样裁剪;env/schema 为 rc.6 正名后的
# 兼容别名(dotenv/json-schema),清单照旧解析。rc.6 起 derive_field_key/decrypt 返回
# Zeroizing（src/config/encryption.rs 已随 rc.10 适配）。
confers = { version = "0.6.0-rc.10", default-features = false, features = ["toml", "env", "validation", "watch", "encryption", "schema", "typescript-schema", "modules"] }
garde = { version = "0.23", default-features = false, features = ["derive"] }
schemars = { version = "1.2", default-features = false }

# Logging infrastructure — 仅核心日志面（LoggerManager/sink）。kit 集成未使用故不启用；
# 驱动由顶层 sqlite/postgres feature 透传 inklog/sqlite、inklog/postgres（kit 需搭配驱动，见 inklog 守卫）
# rc.6-rc.9 新增 secret-scan/schema/audit 桥/i18n/metrics-registry 等能力零接线不启用；
# rc.8 修复 console sink 忽略 enabled=false 的上游缺陷（src/main.rs init_logger 注释同步订正）
inklog = { version = "0.3.0-rc.9", default-features = false, features = ["compression", "fast-masking"] }
log = { version = "0.4", default-features = false }

# Cache infrastructure — 启用 trait-kit 生命周期集成
# rc.6-rc.8 新增 hotkey/adaptive-ttl/warmup/stale/offload/disk 等观测与存储面零接线不启用；
# core 为 rc.6 正名后的 redis-tier 兼容别名，vecboost 仅内存后端（MokaMemoryBackend）
oxcache = { version = "0.5.0-rc.8", default-features = false, features = ["core", "bloom", "compression", "macros", "batch", "lock", "kit"] }

# Rate limiting infrastructure
# feature 瘦身:仅保留实际接线能力(Governor/存储/matchers/审计事件/宏)。
# 裁剪 distributed/chaos-testing/webhook/admin-api/geo-matching/device-matching/
# config-watcher/telemetry/monitoring/inklog/i18n 等未接线项;
# tower-middleware 已回补(2026-09-16 吸收 IETF RateLimit-* 响应头注入,
# 其 middleware::headers 模块被该 feature 门控;dep:tower/http 均已在依赖图内,零新增 crate)。
# rc.6/rc.7 新增 retry/admission-control 等同样零接线不启用;监控面 rc.6 起
# monitoring 正名为 prometheus(兼容别名保留,本仓启用 metrics,无需动作)。
# 若 ../base 后续演进需要其中某能力,按需回补。
# 熔断(circuit-breaker)评估:当前唯一外部依赖是本地 DB(有重试),熔断无标的,不接线。
limiteron = { version = "0.3.0-rc.7", default-features = false, features = ["ban-manager", "gcra", "macros", "metrics", "validation", "kit", "fallback", "audit-log", "multi-tenant", "tower-middleware"] }

# Database infrastructure (db feature) — kit/migration 等未接线项按需启用
# dbnexus re-exports ConnectionTrait/TransactionTrait, but not DatabaseBackend/Statement/Value/DbErr.
# sea-orm 类型统一经 dbnexus::sea_orm re-export（2026-09-20 收敛，原直依赖已移除）。
# 驱动选择（sqlite/postgres 互斥，由 dbnexus compile_error 强制）通过顶层
# `sqlite` / `postgres` feature 进行——不得在依赖声明里硬编码任何驱动，
# 否则另一驱动永久不可用（dbnexus 全图互斥）。
# rc.9 PermissionCache 吸收进 oxcache（permission/cache 特性依赖图新增
# oxcache/stale + dbnexus-limiter-port），vecboost 未直接使用该缓存，仅依赖边变化。
dbnexus = { version = "0.6.0-rc.9", optional = true, default-features = false, features = ["runtime-tokio-rustls", "macros", "permission", "cache", "pool-health-check", "pool-warmup", "retry", "config-env", "observability", "failover", "replica-routing"] }
# failover/replica-routing:inklog integrations::infra 无条件构造 DbConfig 的
# failover_config/replica_config 字段(2026-09-14 dbnexus 加入门控),缺此二者
# inklog 无法编译;../base 侧修复前由 vecboost 侧补齐。

# AI & Math (base)
candle-core = { version = "0.11", default-features = false, features = [] }
candle-nn = { version = "0.11", default-features = false }
candle-transformers = { version = "0.11", default-features = false }
# hgemm_ 垫片（mkl feature，见 src/engine/mkl_shim.rs）：f16 类型 ABI 兼容层
half = { version = "2.7", default-features = false, optional = true }
hf-hub = { workspace = true }
# tokenizers 全平台直接依赖（移除 cfg(target_os) 门控）
tokenizers = { version = "0.23", default-features = false, features = ["http", "onig"] }
# 语言检测（非 optional）：翻译 auto 检测（source_language 缺省时）与 /detect 端点共用同一检测核心
whatlang = { version = "0.18", default-features = false }

# Web Framework (http feature)
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "tokio", "tracing", "macros", "matched-path", "original-uri", "query"] }
axum-extra = { version = "0.12", optional = true, default-features = false, features = ["typed-header"] }
tower-http = { version = "0.7", optional = true, default-features = false, features = ["trace", "cors", "add-extension", "validate-request", "set-header", "timeout", "compression-gzip"] }

# OpenAPI Documentation (http feature)
# macros 是 utoipa::ToSchema derive 宏必需 feature(schema feature 单独启用时也工作)
# utoipa 5.5.0 内部 schema.rs 引用 crate::utoipa::Number(被 cfg(feature="macros") 门控),
# 不启用 macros 会导致 schema feature 单独编译失败
# sdforge rc.6 起自身依赖 utoipa 6.0 并在 openapi 构建下经 prelude 再导出，与本
# crate 的 5.5 在 #[forge] 展开处同名歧义（E0659）——7 个 forge 文件用显式
# `use utoipa;` 钉住本 crate 版本（见 src/api/*.rs）；本 crate 三方版本不动。
utoipa = { version = "5.5", optional = true, default-features = false, features = ["macros", "axum_extras", "chrono", "uuid"] }
# vendored：Swagger UI v5.17.14 随 crate 打包（utoipa-swagger-ui-vendored），
# build script 免联网下载——离线环境（CI 隔离/内网）下 openapi feature 可编译
utoipa-swagger-ui = { version = "9.0", optional = true, default-features = false, features = ["axum", "url", "vendored"] }
uuid = { version = "1.26", optional = true, default-features = false, features = ["v4", "serde"] }
# OpenAI 兼容端点 encoding_format=base64 编码（http feature）
base64 = { version = "0.23", optional = true, default-features = false, features = ["std"] }

# Monitoring (http feature)
# 业务指标直接注册 prometheus default_registry（pipeline gauge + garrison metrics-prometheus 桥接共用），
# 不引入 axum-prometheus 网关式指标（2026-09-19 审计：零引用死依赖，已移除）。
prometheus = { workspace = true, optional = true, features = ["process"] }

# HTTP client (http feature)
# TLS 统一到 rustls（2026-09-19 审计）：此前 default-tls(native-tls) 与 hf-hub 的
# rustls-tls 并存，默认构建链接两套 TLS 栈；对齐 crawlrs 侧（其 reqwest 亦统一 rustls）。
reqwest = { workspace = true, optional = true, features = ["stream", "charset", "http2", "rustls"] }

# gRPC is fully handled by sdforge (unified Call protocol via #[forge(grpc_method)])

# Auth feature — 安全加固：firewall 系列/TOTP/凭证清零/异常检测/协议扩展/生命周期/注解宏
# 0.9.0-rc.3（R01-R18 安全审计整改批）：扫码登录/WebAuthn/密码找回/字段加密等
# 新产品面零接线不开；基础 i18n 在 rc.3 起无条件编译（发布版无 `i18n` feature，
# 仅 i18n-icu 未接线），故特性清单删除 i18n，行为零变化。
# GarrisonError::RateLimited 在 src/error.rs 显式映射限流语义（否则落 _ 兜底成 500）。
garrison = { version = "0.9.0-rc.3", default-features = false, features = ["web-axum", "protocol-jwt", "web-csrf", "cache-memory", "cache-audit", "account-credential", "account-policy", "account-lockout", "secure-masking", "secure-xss", "secure-sanitize", "audit-inklog", "listener", "firewall", "firewall-bruteforce", "firewall-ratelimit", "firewall-ddos", "firewall-anomalous", "secure-totp", "credential-zeroize", "anomalous-detector-dual", "security-alert", "protocol-apikey", "protocol-sign", "protocol-temp", "protocol-zeroize", "backend-kit", "annotation-macros", "secure-ct-eq", "secure-simple-token", "web-cors", "web-security-headers", "metrics-prometheus", "grpc"], optional = true }
aes-gcm = { version = "0.11", optional = true, default-features = false, features = ["alloc", "aes", "getrandom", "rand_core"] }

# ONNX feature
ndarray = { version = "0.17", optional = true, default-features = false, features = ["std"] }
# RC 版本保留完整 semver:ort 至今从未发布稳定版,
# 2.0.0-rc.14 即 crates.io 最新发布版本,"仅稳定版"规则对 ort 无稳定标的可用
ort = { version = "2.0.0-rc.14", optional = true, default-features = false }
# 转录引擎（onnx-engine-unify D3）：WAV 解码头 + fbank FFT；仅经 `transcribe` 引入
hound = { version = "3.5", optional = true, default-features = false }
rustfft = { version = "6.4", optional = true, default-features = false }

# CUDA feature (candle-core/cuda 传递依赖 cudarc 0.19,支持 CUDA 13)
# 项目代码直接使用 cudarc driver API 进行 CUDA 内存管理
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "driver", "cuda-version-from-build-system", "dynamic-linking"] }
nvml-wrapper = { version = "0.13", optional = true, default-features = false }

# Multi-protocol SDK framework — 启用 i18n 国际化 + inklog 日志集成
# context(2026-09-16 吸收)：request_id/trace_id 跨协议传播 + X-Request-Id/X-Trace-Id
# 响应头回显（替代 main.rs 手写 x-request-id 闭包；traceparent/W3C 兼容）
# rc.6 起错误契约统一为 UnifiedError 载荷 {"code","message",...}（HTTP body 与
# gRPC Status details 共享，tests/grpc_e2e.rs 断言已同步）；rc.8 删除 logging
# 特性/StructuredLogger 栈（vecboost 自建 inklog，不启用）；docs 正名 docgen，
# 兼容别名 docs 保留（顶层 http/openapi 特性照旧）。
sdforge = { version = "0.5.0-rc.8", optional = true, default-features = false, features = ["i18n", "inklog", "context"] }

# gRPC server 装配（grpc feature）—— garrison GarrisonGrpcAuthLayer 需要 server 级
# tonic builder：sdforge build_server_with_config 的 auth 槽位是 BearerAuth 具体类型、
# 无 layer 挂载点；服务本体复用 sdforge pub 类型（SdForgeGrpcService /
# sdforge_v1::sd_forge_service_server）自行装配
tonic = { version = "0.14", optional = true, default-features = false, features = ["transport"] }

# CLI argument parsing (cli feature)
clap = { version = "4.6", optional = true, default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }

# Performance: parallel iterator for batch similarity
rayon = { version = "1.12", default-features = false }
character_converter = { version = "2.1.5", default-features = false, optional = true }

# Performance: jemalloc global allocator for multi-threaded workloads
[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]
tikv-jemallocator = { version = "0.7", default-features = false, features = ["background_threads"] }
# decay 运行时调优（wsl2-oom-hardening-r2 D3）：大请求后 RSS 秒级回落
tikv-jemalloc-ctl = { version = "0.7", default-features = false }

# 平台加速后端（opt-in features）。
# 原计划为 target-conditional 自动追加 candle `mkl`，但实测本机链接失败
#（intel-mkl-src 2020.1 静态库缺 `hgemm_`，candle 0.11 mkl.rs 必需；证据见
# docs/PERFORMANCE.md「加速后端说明」），自动启用会使所有 profile 无法链接。故改为显式 feature，
# 在链接正常的工具链/CI 矩阵中按需启用：
# - x86_64 Linux/Windows：`--features mkl`
# - aarch64 macOS：`--features accelerate`


[features]
default = ["http"]

# 协议特性 — 保留 cache/streaming/timestamp (轻量)，移除未接线的 logging/kit/inklog
# sdforge/docs:Swagger UI(/api-docs);dep:dbnexus:在所有 http 构建中统一
# dbnexus feature(含 failover/replica-routing)—— inklog integrations::infra
# 无条件构造这两个 DbConfig 字段,缺 feature 时 inklog 无法编译(见 dbnexus 依赖处注释)
http = ["dep:axum", "dep:axum-extra", "dep:tower-http", "schema", "dep:utoipa-swagger-ui", "dep:uuid", "dep:base64", "dep:prometheus", "dep:reqwest", "sdforge/http", "sdforge/security", "sdforge/cache", "sdforge/streaming", "sdforge/timestamp", "sdforge/docs", "dep:dbnexus"]
grpc = ["sdforge/grpc", "sdforge/ratelimit", "sdforge/security", "dep:tonic"]
cli = ["sdforge/cli", "dep:clap"]
openapi = ["schema", "dep:utoipa-swagger-ui", "sdforge/openapi", "sdforge/docs"]

# OpenAPI Schema 派生特性 — 由 http/openapi 自动启用
# 单独启用时仅引入 utoipa::ToSchema 派生能力（用于 library 模式下的类型导出），
# 不引入 axum/prometheus 等服务端依赖。library 用户通常不需要单独启用此特性。
schema = ["dep:utoipa"]

# MCP (Model Context Protocol) server over stdio, generated by sdforge's
# `#[forge(tool_name = ...)]` macros (which register tools into the inventory)
# and served via `sdforge::mcp::build()` on rmcp's stdio transport. Exposes
# VecBoost embedding tools (embed / embed_batch / similarity) to LLM clients.
# Run with: `vecboost --mcp`.
mcp = ["dep:sdforge", "sdforge/mcp"]

# 存储特性 — db 为驱动无关基础设施；驱动由 sqlite / postgres 显式二选一
# （互斥由 dbnexus compile_error 强制，与 limiteron/garrison 同一约定）。
# 单独启用 db（无驱动）仅保证编译，运行时连接需要搭配一个驱动 feature。
db = ["dep:dbnexus"]
sqlite = ["db", "dbnexus/sqlite", "inklog/sqlite"]
postgres = ["db", "dbnexus/postgres", "inklog/postgres"]

# 功能特性
auth = ["dep:garrison", "dep:aes-gcm"]

# 引擎特性
cuda = ["candle-core/cuda", "candle-nn/cuda", "dep:nvml-wrapper", "dep:cudarc"]
metal = ["candle-core/metal", "candle-nn/metal"]
onnx = ["dep:ndarray", "dep:ort", "ort/ndarray", "ort/std", "ort/load-dynamic", "dep:character_converter"]
# 转录引擎（Qwen3-ASR 三图 + silero VAD）：ort/cuda 仅经此 feature 引入，不进 default
transcribe = ["onnx", "ort/cuda", "dep:hound", "dep:rustfft"]
# CPU 加速后端（opt-in；见上方 target 表注释）。
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl", "dep:half"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
# GGUF 量化引擎开关。启用后编译 engine/quantized_engine.rs；
# 推理后端待 candle 上游 quantized BERT 落地（见模块文档）。
quantized-gguf = []
character_converter = ["dep:character_converter"]

# Binary target — main.rs 是 HTTP server 入口（axum::serve），
# 需要 http feature 才能编译。schema-only 等 library 模式不会构建 bin。
[[bin]]
name = "vecboost"
required-features = ["http"]

# A/B 对比 harness 构造 EngineType::Onnx / Task=Translate 引擎，须 onnx feature
# （未启用时该 variant 不存在）；同 [[bin]] required-features 惯例
[[example]]
name = "translate_ab"
required-features = ["onnx"]

# Platform-specific dependencies

[target.'cfg(target_os = "linux")'.dependencies]

[target.'cfg(target_os = "windows")'.dependencies]

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = { workspace = true }
# tracing/tracing-subscriber/toml 仅测试用(logger/tests.rs 验证 inklog subscriber 集成 + config 测试解析 toml)
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter"] }
toml = { version = "1.1", default-features = false }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# gRPC E2E 测试客户端（tests/grpc_e2e.rs；生成的客户端经由 vecboost::sdforge 再导出访问）
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"] }
serde_json = { workspace = true }

[[bench]]
name = "similarity_bench"
harness = false

[[bench]]
name = "batch_scheduling_bench"
harness = false

[[bench]]
name = "semantic_cache_bench"
harness = false

[[bench]]
name = "embed_throughput_bench"
harness = false

[[bench]]
name = "translate_bench"
harness = false
required-features = ["onnx"]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# ─────────────────────────────────────────────────────────────────────────────
# Workspace — examples 作为独立 crate(member),不发布
# ─────────────────────────────────────────────────────────────────────────────
[workspace]
members = [".", "examples"]
resolver = "2"

[workspace.package]
license = "Apache-2.0"
edition = "2024"
authors = ["Kirky-X <Kirky-X@outlook.com>"]

# 依赖集中管理：主 crate 与 workspace 成员（examples）的重复依赖在此声明一次，
# 成员以 `dep = { workspace = true }` 引用，差异 features（含 optional）在成员侧声明，
# 与 garrison/sinnan 同一惯例。
[workspace.dependencies]
tokio = { version = "1.53", default-features = false, features = ["full"] }
async-trait = { version = "0.1", default-features = false }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false }
hf-hub = { version = "1.0", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = { version = "3.27", default-features = false }
prometheus = { version = "0.14", default-features = false, features = ["process"] }

