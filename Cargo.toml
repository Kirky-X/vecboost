[package]
name = "vecboost"
version = "0.3.0-rc.3"
edition = "2024"
rust-version = "1.91"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
description = "High-performance multi-task inference service: embeddings, rerank, decision, translation, and language detection"
repository = "https://github.com/Kirky-X/vecboost"
documentation = "https://github.com/Kirky-X/vecboost"
homepage = "https://github.com/Kirky-X/vecboost"
license = "Apache-2.0"
keywords = ["embedding", "vector", "inference", "translation", "language-detection"]
categories = ["asynchronous", "science", "web-programming::http-server"]

[dependencies]
# Base async runtime & utilities (always required)
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
sys-info = { version = "0.9", default-features = false }
num_cpus = { version = "1.17", default-features = false }
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
regex = { version = "1.13", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false, features = ["alloc"] }
rand = { version = "0.10", default-features = false, features = ["thread_rng", "alloc"] }
hex = { version = "0.4", default-features = false, features = ["std"] }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
# 0.6 起 hash_password_into 被 alloc feature 门控（derive_key 依赖它）
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }

# Serialization (base)
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }

# Error Handling (base)
anyhow = { version = "1.0", default-features = false, features = ["std"] }

# i18n：fluent-bundle concurrent 双束可入 static + icu 2.3 compiled_data 内置 CLDR
sys-locale = { version = "0.3", default-features = false }
unic-langid = { version = "0.9", default-features = false, features = ["likelysubtags"] }
fluent-bundle = { version = "0.16", default-features = false }
icu = { version = "2.3", default-features = false, features = ["compiled_data"] }
writeable = { version = "0.6", default-features = false }

# trait-kit：reload/confers 热重载 + i18n；20 个 ModuleMeta 均声明 VERSION 供版本协商
trait-kit = { version = "0.5.0-rc.10", default-features = false, features = ["async", "lifecycle", "health", "shutdown", "observer", "scope", "toggle", "decorator", "reload", "confers", "i18n", "negotiate"] }

# 配置：仅保留 toml/env 加载、校验、watch 热重载、加密、schema 导出；其余零接线项裁剪
confers = { version = "0.6.0-rc.11", default-features = false, features = ["toml", "env", "validation", "watch", "encryption", "schema", "typescript-schema", "modules"] }
garde = { version = "0.23", default-features = false, features = ["derive"] }
schemars = { version = "1.2", default-features = false }

# Logging infrastructure — 仅核心日志面（LoggerManager/sink）
inklog = { version = "0.3.0-rc.10", default-features = false, features = ["compression", "fast-masking"] }
log = { version = "0.4", default-features = false }

# 缓存：trait-kit 生命周期集成；仅内存后端（MokaMemoryBackend），hotkey/adaptive-ttl 等零接线不启用
oxcache = { version = "0.5.0-rc.10", default-features = false, features = ["core", "bloom", "compression", "macros", "batch", "lock", "kit"] }

# Rate limiting infrastructure feature 瘦身:仅保留实际接线能力(Governor/存储/matchers/审计事件/宏)
limiteron = { version = "0.3.0-rc.8", default-features = false, features = ["ban-manager", "gcra", "macros", "metrics", "validation", "kit", "fallback", "audit-log", "multi-tenant", "tower-middleware"] }
# 语义缓存的跨副本 trigram 索引；仅 distributed-redis 启用（默认构建零 Redis 依赖）。
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "tokio-rustls-comp"], optional = true }

# 数据库：kit/migration 等未接线项按需启用；sea-orm 类型统一经 dbnexus 转发
dbnexus = { version = "0.6.0-rc.10", optional = true, default-features = false, features = ["runtime-tokio-rustls", "macros", "permission", "cache", "pool-health-check", "pool-warmup", "retry", "config-env", "observability", "failover", "replica-routing"] }
# failover/replica-routing：inklog 无条件构造 DbConfig 两字段，缺则无法编译

# AI & Math：candle 转 optional（zip 风险出树），默认主引擎 onnxruntime（ort）
candle-core = { version = "0.11", default-features = false, features = [], optional = true }
candle-nn = { version = "0.11", default-features = false, optional = true }
candle-transformers = { version = "0.11", default-features = false, optional = true }
# hgemm_ 垫片（mkl feature，见 src/engine/mkl_shim.rs）：f16 类型 ABI 兼容层
half = { version = "2.7", default-features = false, optional = true }
hf-hub = { workspace = true }
# tokenizers 全平台直接依赖（移除 cfg(target_os) 门控）
tokenizers = { version = "0.23", default-features = false, features = ["http", "onig"] }
# 语言检测（非 optional）：翻译 auto 检测（source_language 缺省时）与 /detect 端点共用同一检测核心
whatlang = { version = "0.18", default-features = false }

# Web Framework (http feature)
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "tokio", "tracing", "macros", "matched-path", "original-uri", "query"] }
axum-extra = { version = "0.12", optional = true, default-features = false, features = ["typed-header"] }
tower-http = { version = "0.7", optional = true, default-features = false, features = ["trace", "cors", "add-extension", "validate-request", "set-header", "timeout", "compression-gzip"] }

# OpenAPI：macros 为 utoipa::ToSchema 派生必需（单独 schema 也可用）
utoipa = { version = "5.5", optional = true, default-features = false, features = ["macros", "axum_extras", "chrono", "uuid"] }
uuid = { version = "1.26", optional = true, default-features = false, features = ["v4", "serde"] }
# OpenAI 兼容端点 encoding_format=base64 编码（http feature）
base64 = { version = "0.23", optional = true, default-features = false, features = ["std"] }

# 监控：业务指标直连 prometheus default_registry，不引入 axum-prometheus
prometheus = { workspace = true, optional = true, features = ["process"] }

# HTTP 客户端：TLS 统一 rustls，避免 native-tls 与 rustls 双栈并存
reqwest = { workspace = true, optional = true, features = ["stream", "charset", "http2", "rustls"] }

# gRPC is fully handled by sdforge (unified Call protocol via #[forge(grpc_method)])

# 认证：firewall/TOTP/凭证清零/异常检测等；rc.3 起 i18n 无条件编译
garrison = { version = "0.9.0-rc.4", default-features = false, features = ["web-axum", "protocol-jwt", "web-csrf", "cache-memory", "cache-audit", "account-credential", "account-policy", "account-lockout", "secure-masking", "secure-xss", "secure-sanitize", "audit-inklog", "listener", "firewall", "firewall-bruteforce", "firewall-ratelimit", "firewall-ddos", "firewall-anomalous", "secure-totp", "credential-zeroize", "anomalous-detector-dual", "security-alert", "protocol-apikey", "protocol-sign", "protocol-temp", "protocol-zeroize", "backend-kit", "annotation-macros", "secure-ct-eq", "secure-simple-token", "web-cors", "web-security-headers", "metrics-prometheus", "grpc"], optional = true }
aes-gcm = { version = "0.11", optional = true, default-features = false, features = ["alloc", "aes", "getrandom", "rand_core"] }

# ONNX feature
ndarray = { version = "0.17", optional = true, default-features = false, features = ["std"] }
# RC 版本保留完整 semver:ort 至今从未发布稳定版,
# 2.0.0-rc.14 即 crates.io 最新发布版本,"仅稳定版"规则对 ort 无稳定标的可用
ort = { version = "2.0.0-rc.14", optional = true, default-features = false }
# 转录引擎（onnx-engine-unify D3）：WAV 解码头 + fbank FFT；仅经 `transcribe` 引入
hound = { version = "3.5", optional = true, default-features = false }
rustfft = { version = "6.4", optional = true, default-features = false }

# CUDA：cudarc + nvml，与推理后端正交（ort 经 transcribe，candle 经 candle-cuda）
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "driver", "cuda-version-from-build-system", "dynamic-linking"] }
nvml-wrapper = { version = "0.13", optional = true, default-features = false }

# SDK：i18n + inklog；context 提供 request_id/trace_id 跨协议传播
sdforge = { version = "0.5.0-rc.9", optional = true, default-features = false, features = ["i18n", "inklog", "context"] }

# gRPC：garrison GarrisonGrpcAuthLayer 需 server 级 tonic builder（sdforge 无 layer 挂载点）
tonic = { version = "0.14", optional = true, default-features = false, features = ["transport"] }

# CLI argument parsing (cli feature)
clap = { version = "4.6", optional = true, default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }

# Performance: parallel iterator for batch similarity
rayon = { version = "1.12", default-features = false }
character_converter = { version = "2.1.5", default-features = false, optional = true }

# Performance: jemalloc global allocator for multi-threaded workloads
[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]
tikv-jemallocator = { version = "0.7", default-features = false, features = ["background_threads"] }
# decay 运行时调优（wsl2-oom-hardening-r2 D3）：大请求后 RSS 秒级回落
tikv-jemalloc-ctl = { version = "0.7", default-features = false }

# 平台加速（opt-in）：Linux/Windows 用 mkl，aarch64 macOS 用 accelerate


[features]
# onnx-primary（2026-10-16）：默认构建即含 ort 主引擎（http 服务启动即用）
default = ["http", "onnx"]

# 协议：保留 cache/streaming/timestamp；Swagger UI 独立为 swagger-ui feature
http = ["dep:axum", "dep:axum-extra", "dep:tower-http", "schema", "dep:uuid", "dep:base64", "dep:prometheus", "dep:reqwest", "sdforge/http", "sdforge/security", "sdforge/cache", "sdforge/streaming", "sdforge/timestamp", "dep:dbnexus"]
grpc = ["sdforge/grpc", "sdforge/ratelimit", "sdforge/security", "dep:tonic"]
cli = ["sdforge/cli", "dep:clap"]
openapi = ["schema", "sdforge/openapi"]
# Swagger UI 交互页 + /api-docs/openapi.json（opt-in，默认不编译）；
# 页面与资产由 sdforge/docs 内置 docgen 提供（0.5.0-rc.9 起不再经 utoipa-swagger-ui）
swagger-ui = ["openapi", "sdforge/docs"]

# schema 派生：由 http/openapi 自动启用；单独启用仅供 library 类型导出
schema = ["dep:utoipa"]

# MCP：sdforge #[forge] 注册工具，经 mcp::build 暴露 stdio 服务
mcp = ["dep:sdforge", "sdforge/mcp"]

# 存储：db 为驱动无关基础设施，驱动由 sqlite/postgres 二选一（compile_error 互斥）
db = ["dep:dbnexus"]
# garrison 的 db-* 驱动仅在启用 auth 时随 sqlite/postgres 联动（garrison? 弱
# 可选语法）；供 [auth] session_backend = "database" 的 DbnexusKvDao 使用。
sqlite = ["db", "dbnexus/sqlite", "inklog/sqlite", "garrison?/db-sqlite"]
postgres = ["db", "dbnexus/postgres", "inklog/postgres", "garrison?/db-postgres"]

# 功能特性
auth = ["dep:garrison", "dep:aes-gcm"]

# 引擎特性 — onnx-primary：ort 为默认主推理引擎；candle 降级 opt-in 回退后端（显式 `--features candle` 启用）
onnx = ["dep:ndarray", "dep:ort", "ort/ndarray", "ort/std", "ort/load-dynamic", "dep:character_converter"]
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]
# CUDA 设备支持（cudarc driver + nvml 检测，后端正交）；candle 的 CUDA
# 计算后端单独经 candle-cuda（不随 cuda 隐含，避免 ort-only 用户被动拉 candle）。
cuda = ["dep:nvml-wrapper", "dep:cudarc"]
candle-cuda = ["candle", "candle-core/cuda", "candle-nn/cuda"]
metal = ["candle", "candle-core/metal", "candle-nn/metal"]
# 转录引擎（Qwen3-ASR 三图 + silero VAD）：ort/cuda 仅经此 feature 引入，不进 default
transcribe = ["onnx", "ort/cuda", "dep:hound", "dep:rustfft"]
# CPU 加速后端（candle 路径 opt-in；见上方 target 表注释）。
mkl = ["candle", "candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl", "dep:half"]
accelerate = ["candle", "candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
# GGUF 量化引擎开关（加载期反量化桥实现于 candle 路径，故隐含 candle）
quantized-gguf = ["candle"]
# Redis 多副本：限流 Lua 原子计数 + 缓存共享；启用 limiteron distributed/oxcache redis
distributed-redis = ["limiteron/cache-redis", "limiteron/distributed", "limiteron/lua-script", "limiteron/ban-sync", "oxcache/redis", "oxcache/lua", "dep:redis"]
character_converter = ["dep:character_converter"]

# Binary target — main.rs 是 HTTP server 入口（axum::serve），
# 需要 http feature 才能编译。schema-only 等 library 模式不会构建 bin。
[[bin]]
name = "vecboost"
required-features = ["http"]

# A/B 对比 harness 构造 EngineType::Onnx / Task=Translate 引擎，须 onnx feature
# （未启用时该 variant 不存在）；同 [[bin]] required-features 惯例
[[example]]
name = "translate_ab"
required-features = ["onnx"]

# Platform-specific dependencies

[target.'cfg(target_os = "linux")'.dependencies]

[target.'cfg(target_os = "windows")'.dependencies]

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = { workspace = true }
# tracing/tracing-subscriber/toml 仅测试用(logger/tests.rs 验证 inklog subscriber 集成 + config 测试解析 toml)
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter"] }
toml = { version = "1.1", default-features = false }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# gRPC E2E 测试客户端（tests/grpc_e2e.rs；生成的客户端经由 vecboost::sdforge 再导出访问）
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"] }
serde_json = { workspace = true }

[[bench]]
name = "similarity_bench"
harness = false

[[bench]]
name = "batch_scheduling_bench"
harness = false

[[bench]]
name = "semantic_cache_bench"
harness = false

[[bench]]
name = "embed_throughput_bench"
harness = false

# 重排吞吐基线（bi-encoder 派生成本：单对 rerank 与 1×32 rerank_batch）。
# 与 embed_throughput_bench 共用 VECBOOST_BENCH_MODEL / _ENGINE / _DEVICE 选择器
[[bench]]
name = "rerank_bench"
harness = false

[[bench]]
name = "translate_bench"
harness = false
required-features = ["onnx"]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Workspace — examples 作为独立 crate(member),不发布
[workspace]
members = [".", "examples"]
resolver = "2"

[workspace.package]
license = "Apache-2.0"
edition = "2024"
authors = ["Kirky-X <Kirky-X@outlook.com>"]

# 依赖集中管理：主 crate 与 examples 的重复依赖在此声明，成员用 workspace = true
[workspace.dependencies]
tokio = { version = "1.53", default-features = false, features = ["full"] }
async-trait = { version = "0.1", default-features = false }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false }
hf-hub = { version = "1.0", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = { version = "3.27", default-features = false }
prometheus = { version = "0.14", default-features = false, features = ["process"] }

