# cargo-deny 配置:依赖供应链门禁(advisories/licenses/bans)
# 运行:cargo deny check

[advisories]
version = 2
# 漏洞(vulnerability)必须修复;unmaintained/yanked 为信息性警告,不阻断 CI,
# 但 cargo audit 仍会显示,发布前人工复核并记录处置结论。
# unsound 键已被 cargo-deny 0.18 移除(EmbarkStudios/cargo-deny#611,无替代键),故不配置。
unmaintained = "none"
yanked = "allow"
# 处置策略:出现新 advisory 时,若为不可达路径(transitive/未启用 feature)
# 可在此以 { id = "...", reason = "..." } 记录豁免;否则必须升级修复。
ignore = [
  # RUSTSEC-2023-0071 (Marvin Attack) 针对 RSA PKCS#1 v1.5 **解密** 的时序侧信道。
  # VecBoost 仅通过 garrison → jsonwebtoken 使用 rsa 做 **JWT 签名/验证**,
  # 不涉及 RSA 解密路径,攻击面不适用;且上游 RustCrypto/RSA 至今无补丁版本,
  # 无法通过升级修复。豁免持续跟踪 https://github.com/RustCrypto/RSA/issues/626,
  # 一旦上游发布 constant-time 实现即撤销本豁免并升级。
  { id = "RUSTSEC-2023-0071", reason = "transitive via jsonwebtoken for JWT signing only; Marvin targets RSA decryption, not applicable; no upstream patch available" },
  # RUSTSEC-2026-0381（webpki-roots 内置根证书含被撤销的 emSign 中间根）。
  # 命中路径（cargo tree -i webpki-roots@0.26.11 可复现）：tokenizers 0.23.2 →
  # hf-hub 0.4.3 → ureq 2.12.1 → webpki-roots 0.26.11。0.26.11 已是 0.26 系列最新版
  # （crates.io 版本列表），无同系列补丁可升；修复只存在于 1.x 分支（1.0.10），
  # 本仓另一份 webpki-roots 1.0.9 已于本轮升到 1.0.10、webpki-root-certs 同步升到 1.0.10。
  # 影响面：webpki-roots 仅为内置根证书数据，只有当对端证书链由 emSign 根签名时才
  # 存在误信任可能；本仓该 0.26 副本的唯一消费者是 hf-hub 的模型下载请求
  # （目标为 huggingface.co / HF 镜像），不经 emSign 链。
  # 退出条件：hf-hub/ureq 升代（如 ureq 3.x）使依赖图不再出现 webpki-roots 0.26
  # 时删除本条，并重跑 cargo deny check 与 cargo audit 确认全绿。
  { id = "RUSTSEC-2026-0381", reason = "transitive webpki-roots 0.26.11 via tokenizers -> hf-hub -> ureq; 0.26.11 is the newest 0.26.x so no in-series patch exists (fix is 1.0.10, which the 1.x copy in this lock is already updated to); data-only crate, only reachable from the HF model-download path which never validates emSign-issued chains" },
  # RUSTSEC-2026-0387（crypto-bigint 0.5.5 常时断言存在时序变差）。命中链：
  # garrison → jsonwebtoken 11 → p256 0.13.2（已最新）→ elliptic-curve → crypto-bigint 0.5.5。
  # 修复要求 crypto-bigint >= 0.7.6，但 p256/elliptic-curve 上游尚未跟进发布兼容 0.7.x
  # 的版本，升级链断裂无法在本仓闭合。本仓无 crypto-bigint 直依赖、不实现曲线运算，
  # JWT 消费面仅 RS256/HS256 签名验证。退出条件：p256 发布拉入 crypto-bigint >= 0.7.6
  # 的版本后撤销本条并升级（同 .cargo/audit.toml 同 ID 条目口径）。
  { id = "RUSTSEC-2026-0387", reason = "transitive crypto-bigint 0.5.5 via garrison -> jsonwebtoken -> p256 0.13.2 (latest) -> elliptic-curve; fix requires >=0.7.6 but p256 has not released a compatible line yet, no in-series patch exists; no direct curve arithmetic in this crate, JWT consumption is signature verification only" },
  # RUSTSEC-2026-0450（ocipkg OCI 解包路径穿越，可写/删镜像库外文件，可升级为代码执行）。
  # 命中链（cargo tree -i ocipkg --all-features 可复现）：candle-core 0.11（optional，
  # candle 特性）→ intel-mkl-src 0.8.1 的 **build-dependencies** → ocipkg ^0.2.8。
  # 受害函数 ocipkg::image::load 仅在 intel-mkl-src 构建脚本实际下载并解包 MKL OCI
  # 归档时执行：CI 全部 job 均未启用 candle（同 RUSTSEC-2026-0367/0368/0369 先例
  # 口径），本仓本地构建（macOS arm64）不在 MKL 支持面。上游 intel-mkl-src 0.8.1
  # 已是最新且钉 ocipkg ^0.2.8，ocipkg 本身已 unmaintained（RUSTSEC-2026-0449），
  # 修复链断裂无法在本仓闭合。退出条件：intel-mkl-src 发布拉入 ocipkg >=0.4.1 的
  # 版本，或 candle 移除 mkl 路径时删除本条并重跑 cargo deny check 与 cargo audit
  # 确认全绿。
  { id = "RUSTSEC-2026-0450", reason = "build-time only: ocipkg 0.2.9 via candle-core (optional, candle feature) -> intel-mkl-src 0.8.1 build-dependencies (newest, pins ^0.2.8); affected fn ocipkg::image::load runs only when the build script downloads/unpacks MKL OCI archives, which never happens in CI (no job enables candle) or local macOS arm64 builds; ocipkg is unmaintained (RUSTSEC-2026-0449) so no fix line exists" },
  # RUSTSEC-2026-0459（libsqlite3-sys bundled SQLite <3.54.0：本地攻击者以页大小
  # 不一致的 DB+-wal 文件对诱导打开，普通查询返回未初始化内存；CVE-2026-119375，
  # CVSS AV:L 本地向量）。命中链：dbnexus 0.6.0 → sea-orm 2.0.4 → sqlx 0.9.0 →
  # sqlx-sqlite 0.9.0（sqlite-bundled）→ libsqlite3-sys 0.37.0 [bundled]。修复要求
  # libsqlite3-sys >=0.39.0，但 sqlx-sqlite 0.9.0（已是最新）钉 >=0.30.1,<0.38.0，
  # 升级链断裂无法在本仓闭合。攻击面不适用：受害条件是进程打开"较不可信方可写"的
  # DB+wal 文件对——vecboost 的 SQLite 路径全部来自运维配置（[database] url，API
  # 不接受任何客户端指定的 DB 路径），测试面为 sqlite::memory:（无 WAL）；能向服务
  # 端数据目录植入 DB/wal 的本地攻击者已等价持有宿主代码执行权（同 0387 先例
  # "攻击面不成立"口径）。退出条件：sqlx 发布拉入 libsqlite3-sys >=0.39.0 的版本后
  # 撤销本条并升级（同 .cargo/audit.toml 同 ID 条目口径）。
  { id = "RUSTSEC-2026-0459", reason = "bundled SQLite <3.54.0 via dbnexus -> sea-orm -> sqlx -> sqlx-sqlite 0.9.0 (newest, pins >=0.30.1,<0.38.0; fix needs >=0.39.0, upstream chain broken); exploit requires the process to open an attacker-writable DB+-wal file pair (AV:L) - vecboost only opens operator-configured database URLs (no client-supplied DB paths via API), tests use sqlite::memory: (no WAL)" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "MPL-2.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  # CC0-1.0: 公有领域贡献(notify 等),BSL-1.0: Boost 软件许可(xxhash-rust 等),
  # 两者均为宽松许可,与 MIT/Apache-2.0 兼容。
  "CC0-1.0",
  "BSL-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
