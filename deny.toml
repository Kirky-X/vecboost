# cargo-deny 配置:依赖供应链门禁(advisories/licenses/bans)
# 运行:cargo deny check

[advisories]
version = 2
# 处置策略:出现新 advisory 时,若为不可达路径(transitive/未启用 feature)
# 可在此以 { crate = "...", reason = "..." } 记录豁免;否则必须升级修复。
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "MPL-2.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
