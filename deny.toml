# cargo-deny 配置:依赖供应链门禁(advisories/licenses/bans)
# 运行:cargo deny check

[advisories]
version = 2
# 漏洞(vulnerability)必须修复;unmaintained/yanked/unsound 为信息性警告,
# 不阻断 CI,但 cargo audit 仍会显示,发布前人工复核并记录处置结论。
unmaintained = "none"
yanked = "allow"
unsound = "none"
# 处置策略:出现新 advisory 时,若为不可达路径(transitive/未启用 feature)
# 可在此以 { id = "...", reason = "..." } 记录豁免;否则必须升级修复。
ignore = [
  # RUSTSEC-2023-0071 (Marvin Attack) 针对 RSA PKCS#1 v1.5 **解密** 的时序侧信道。
  # VecBoost 仅通过 garrison → jsonwebtoken 使用 rsa 做 **JWT 签名/验证**,
  # 不涉及 RSA 解密路径,攻击面不适用;且上游 RustCrypto/RSA 至今无补丁版本,
  # 无法通过升级修复。豁免持续跟踪 https://github.com/RustCrypto/RSA/issues/626,
  # 一旦上游发布 constant-time 实现即撤销本豁免并升级。
  { id = "RUSTSEC-2023-0071", reason = "transitive via jsonwebtoken for JWT signing only; Marvin targets RSA decryption, not applicable; no upstream patch available" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "MPL-2.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  # CC0-1.0: 公有领域贡献(notify 等),BSL-1.0: Boost 软件许可(xxhash-rust 等),
  # 两者均为宽松许可,与 MIT/Apache-2.0 兼容。
  "CC0-1.0",
  "BSL-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
