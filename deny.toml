# cargo-deny 配置:依赖供应链门禁(advisories/licenses/bans)
# 运行:cargo deny check

[advisories]
version = 2
# 漏洞(vulnerability)必须修复;unmaintained/yanked 为信息性警告,不阻断 CI,
# 但 cargo audit 仍会显示,发布前人工复核并记录处置结论。
# unsound 键已被 cargo-deny 0.18 移除(EmbarkStudios/cargo-deny#611,无替代键),故不配置。
unmaintained = "none"
yanked = "allow"
# 处置策略:出现新 advisory 时,若为不可达路径(transitive/未启用 feature)
# 可在此以 { id = "...", reason = "..." } 记录豁免;否则必须升级修复。
ignore = [
  # RUSTSEC-2023-0071 (Marvin Attack) 针对 RSA PKCS#1 v1.5 **解密** 的时序侧信道。
  # VecBoost 仅通过 garrison → jsonwebtoken 使用 rsa 做 **JWT 签名/验证**,
  # 不涉及 RSA 解密路径,攻击面不适用;且上游 RustCrypto/RSA 至今无补丁版本,
  # 无法通过升级修复。豁免持续跟踪 https://github.com/RustCrypto/RSA/issues/626,
  # 一旦上游发布 constant-time 实现即撤销本豁免并升级。
  { id = "RUSTSEC-2023-0071", reason = "transitive via jsonwebtoken for JWT signing only; Marvin targets RSA decryption, not applicable; no upstream patch available" },
  # RUSTSEC-2026-0381（webpki-roots 内置根证书含被撤销的 emSign 中间根）。
  # 命中路径（cargo tree -i webpki-roots@0.26.11 可复现）：tokenizers 0.23.2 →
  # hf-hub 0.4.3 → ureq 2.12.1 → webpki-roots 0.26.11。0.26.11 已是 0.26 系列最新版
  # （crates.io 版本列表），无同系列补丁可升；修复只存在于 1.x 分支（1.0.10），
  # 本仓另一份 webpki-roots 1.0.9 已于本轮升到 1.0.10、webpki-root-certs 同步升到 1.0.10。
  # 影响面：webpki-roots 仅为内置根证书数据，只有当对端证书链由 emSign 根签名时才
  # 存在误信任可能；本仓该 0.26 副本的唯一消费者是 hf-hub 的模型下载请求
  # （目标为 huggingface.co / HF 镜像），不经 emSign 链。
  # 退出条件：hf-hub/ureq 升代（如 ureq 3.x）使依赖图不再出现 webpki-roots 0.26
  # 时删除本条，并重跑 cargo deny check 与 cargo audit 确认全绿。
  { id = "RUSTSEC-2026-0381", reason = "transitive webpki-roots 0.26.11 via tokenizers -> hf-hub -> ureq; 0.26.11 is the newest 0.26.x so no in-series patch exists (fix is 1.0.10, which the 1.x copy in this lock is already updated to); data-only crate, only reachable from the HF model-download path which never validates emSign-issued chains" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "MPL-2.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  # CC0-1.0: 公有领域贡献(notify 等),BSL-1.0: Boost 软件许可(xxhash-rust 等),
  # 两者均为宽松许可,与 MIT/Apache-2.0 兼容。
  "CC0-1.0",
  "BSL-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
