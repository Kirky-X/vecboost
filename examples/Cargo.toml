[package]
name = "vecboost-examples"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Functional examples for the VecBoost embedding service"

[dependencies]
# 通过 path 依赖主 crate,默认开启所有非引擎 features
# 引擎 features(onnx/metal)通过本 crate 的 features 透传,可选启用
# 注:oxcache/limiteron/inklog/confers 在主 crate 中已是必选依赖,无需在此声明 feature
vecboost = { path = "..", default-features = false, features = [
    "http",
    "auth",
    "cli",
    "grpc",
    "db",
    "redis",
] }

# 示例直接使用的第三方 crate
tokio = { version = "1.0", default-features = false, features = ["full"] }
async-trait = { version = "0.1", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["default-tls"] }
hf-hub = { version = "1.0", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = { version = "3.0", default-features = false }
prometheus = { version = "0.14", default-features = false, features = ["process"] }

[features]
default = []
# 引擎特性透传
onnx = ["vecboost/onnx"]
metal = ["vecboost/metal"]

# ─────────────────────────────────────────────────────────────────────────────
# Binaries — 30 个示例
# ─────────────────────────────────────────────────────────────────────────────

# download_model — 模型下载工具
[[bin]]
name = "download_model"
path = "download_model.rs"

# basic — 基础用法(MockEngine + api::embed/embed_batch/compute_similarity/rerank)
[[bin]]
name = "embed"
path = "basic/embed.rs"

[[bin]]
name = "batch"
path = "basic/batch.rs"

[[bin]]
name = "similarity"
path = "basic/similarity.rs"

[[bin]]
name = "rerank"
path = "basic/rerank.rs"

# engine — Candle/Onnx 引擎初始化与运行时切换
[[bin]]
name = "candle"
path = "engine/candle.rs"

[[bin]]
name = "onnx"
path = "engine/onnx.rs"
required-features = ["onnx"]

[[bin]]
name = "switch"
path = "engine/switch.rs"

# http — HTTP API 客户端(reqwest 调用本地服务)
[[bin]]
name = "embed_api"
path = "http/embed_api.rs"

[[bin]]
name = "batch_api"
path = "http/batch_api.rs"

[[bin]]
name = "similarity_api"
path = "http/similarity_api.rs"

[[bin]]
name = "rerank_api"
path = "http/rerank_api.rs"

# cli — 命令行子进程调用
[[bin]]
name = "embed_cli"
path = "cli/embed_cli.rs"

[[bin]]
name = "batch_cli"
path = "cli/batch_cli.rs"

[[bin]]
name = "rerank_cli"
path = "cli/rerank_cli.rs"

# auth — JWT/CSRF/Refresh 流程
[[bin]]
name = "jwt_auth"
path = "auth/jwt_auth.rs"

[[bin]]
name = "csrf"
path = "auth/csrf.rs"

[[bin]]
name = "refresh"
path = "auth/refresh.rs"

# cache — oxcache 配置与 TTL 验证
[[bin]]
name = "cache_config"
path = "cache/cache_config.rs"

[[bin]]
name = "ttl"
path = "cache/ttl.rs"

# rate-limiting — limiteron 多维度限流
[[bin]]
name = "rate_limit"
path = "rate-limiting/rate_limit.rs"

[[bin]]
name = "multi_dimension"
path = "rate-limiting/multi_dimension.rs"

# monitoring — Prometheus 指标与推理性能监控
[[bin]]
name = "metrics"
path = "monitoring/metrics.rs"

[[bin]]
name = "performance"
path = "monitoring/performance.rs"

# library — VecBoostLibrary SDK（library 模式，异步+同步 API）
[[bin]]
name = "library_usage"
path = "library/library_usage.rs"

# semantic-cache — 语义缓存（trigram Jaccard 三级查询策略）
[[bin]]
name = "semantic_cache_demo"
path = "semantic-cache/semantic_cache_demo.rs"

# security — 密钥管理、盐值生成、敏感数据脱敏
[[bin]]
name = "security_demo"
path = "security/security_demo.rs"

# audit — 审计日志（异步批量写入 + 文件轮转）
[[bin]]
name = "audit_demo"
path = "audit/audit_demo.rs"

# matryoshka — Matryoshka 维度约简（任务自适应截断 + 信息保留率）
[[bin]]
name = "matryoshka"
path = "basic/matryoshka.rs"

# validation — 输入验证（文本/路径/模型 ID 校验）
[[bin]]
name = "validation"
path = "basic/validation.rs"
