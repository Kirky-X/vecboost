[package]
name = "transcribe-poc"
version = "0.2.0"
edition = "2021"
description = "Thin-shell Qwen3-ASR transcription CLI: inference lives in vecboost (transcribe feature); this crate keeps CLI/contract/py-torch baseline (transcribe-poc-shell-a)"

[[bin]]
name = "transcribe-own"
path = "src/main.rs"
# 契约关键行（WALL_S/RTF/SEGMENTS/TRANSCRIPT_CHARS/MODE）+ 退出码逐字保持；
# 推理删尽后本 crate 失去本地测试资产断言面，编译面即门面。
required-features = []

[dependencies]
# 推理实现已并入主仓（src/engine/transcribe/）：路径依赖 + transcribe feature
vecboost = { path = "..", features = ["transcribe"] }
pyo3 = { version = "=0.29.0", features = ["auto-initialize"] }

[profile.release]
opt-level = 3
lto = "thin"

# Standalone crate, deliberately not a member of the worktree workspace
# (workspace table must stay last: keys after a table header belong to it).
[workspace]
